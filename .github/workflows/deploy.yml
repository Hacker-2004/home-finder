name: Nightly Property Scraper

on:
  schedule:
    # 11:59:59 PM EST is 03:59 AM UTC
    - cron: '59 3 * * *'
  workflow_dispatch: # Allows manual run anytime

jobs:
  run-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests pandas openpyxl

      - name: Execute Scraper
        run: python generate_json.py

      - name: Commit Updated Data Back to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add listings.json homes.xlsx
          git diff-index --quiet HEAD || git commit -m "Auto-update active home listings"
          git push
