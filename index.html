<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PA Home Finder (< $600k, 3+ Bed, >2k SqFt)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
  <div class="max-w-7xl mx-auto">
    <header class="mb-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <h1 class="text-3xl font-bold text-gray-900">Active Listings Dashboard</h1>
        <p class="text-gray-600">Montgomery & Bucks County | ≤ $600k | ≥ 3 Beds | ≥ 2,000 SqFt</p>
      </div>
      <div id="count" class="bg-blue-600 text-white font-semibold px-4 py-2 rounded-lg shadow">
        Loading...
      </div>
    </header>

    <div id="grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </div>

  <script>
    async function loadListings() {
      try {
        const res = await fetch('./listings.json?t=' + new Date().getTime());
        const homes = await res.json();
        
        document.getElementById('count').innerText = `${homes.length} Active Homes Found`;
        const grid = document.getElementById('grid');
        grid.innerHTML = '';

        if (!homes || homes.length === 0) {
          grid.innerHTML = `<div class="col-span-3 text-center bg-white p-12 rounded-xl shadow text-gray-500 font-medium">No active homes match your exact criteria right now. Check back tonight after 11:59 PM!</div>`;
          return;
        }

        homes.forEach(home => {
          const card = `
            <div class="bg-white rounded-xl shadow-md p-6 border-t-4 border-blue-600 hover:shadow-xl transition duration-200">
              <div class="text-3xl font-bold text-green-700 mb-1">$${home.price.toLocaleString()}</div>
              <h2 class="text-xl font-semibold text-gray-800">${home.address}</h2>
              <p class="text-sm text-gray-500 mb-4">${home.city}, ${home.state} ${home.zip}</p>
              
              <div class="flex justify-between text-sm text-gray-600 border-t border-b py-3 mb-4">
                <span><strong>${home.beds}</strong> Beds</span>
                <span><strong>${home.baths}</strong> Baths</span>
                <span><strong>${home.sqft.toLocaleString()}</strong> SqFt</span>
              </div>
              
              <a href="${home.url}" target="_blank" class="block text-center bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg transition">
                View Listing on Redfin →
              </a>
            </div>
          `;
          grid.innerHTML += card;
        });
      } catch (err) {
        console.error("Failed to load listings:", err);
      }
    }

    loadListings();
  </script>
</body>
</html>
